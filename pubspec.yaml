name: gt_mobile_ui
description: "A new Flutter package project."
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ">=3.10.0 <=5.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.4.1
  gt_mobile_foundation:
    git:
      url: https://github.com/gofinancials/gt_mobile_foundation.git
      ref: v0.0.74
  pin_code_fields: ^9.3.0
  styled_text:
    git:
      url: https://github.com/dirisujesse/styled_text_package.git
      path: styled_text
      ref: v0.0.2
  table_calendar: ^3.2.0
  vector_graphics: ^1.1.19
  vector_graphics_compiler: ^1.1.19
  provider: ^6.1.5+1
  pdf: ^3.12.0
  barcode: ^2.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  gt_a11y_lints:
    path: tools/gt_a11y_lints
  build_runner: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OpenRunde-Medium.ttf
    - assets/fonts/OpenRunde-Semibold.ttf
    - assets/images/raster/
    - assets/images/vector/
    - path: assets/images/vector/
      transformers:
        - package: vector_graphics_compiler
    - path: assets/images/vector/illustrations/
      transformers:
        - package: vector_graphics_compiler
    - path: assets/images/vector/illustrations/red/
      transformers:
        - package: vector_graphics_compiler
  fonts:
    - family: Runde
      fonts:
        - asset: assets/fonts/OpenRunde-Regular.otf
        - asset: assets/fonts/OpenRunde-Medium.otf
          weight: 500
        - asset: assets/fonts/OpenRunde-Semibold.otf
          weight: 600
        - asset: assets/fonts/OpenRunde-Bold.otf
          weight: 700
    # Momo Trust Display lacks most currency symbols, so ₦ ₩ ₪ ₱ ₲ ₴ ₵ ₹ ₺ ₽ ₿
    # are copied in from GoTech Display Black (the weight closest to Momo's
    # stems), scaled from its 720 cap height to Momo's 750.
    # Momo also draws capitals and digits larger than Youth at the same font
    # size (cap height 0.750em vs 0.700em), so the whole file, currency
    # symbols included, is then scaled by 0.933 with fontTools' scale_upem
    # (unitsPerEm kept at 1000) to render at Youth's cap height. Its name
    # table version reads "adds GoTech Display Black currency symbols; scaled
    # 0.933 to Youth cap height".
    # Momo's stems were also ~7% heavier than Youth Bold's, so every outline
    # is finally inset by 5 font units with skia-pathops (stroke the outline,
    # subtract it, miter joins) and stretched back to the baseline and the
    # 700 cap height. Vertical stems are then 0.221 of the cap height, as in
    # Youth Bold; advances are unchanged. The original file: git show
    # bd3bf6b8:assets/fonts/MomoTrustDisplay-Regular.otf
    # Momo has a single, already heavy weight. It is registered at 700, like
    # Youth-Bold was, because the styles ask for bold and a face registered
    # at 400 would be faux-bolded, thickening and widening every glyph.
    - family: Momo
      fonts:
        - asset: assets/fonts/MomoTrustDisplay-Regular.otf
          weight: 700
    - family: GtIconFont
      fonts:
        - asset: assets/fonts/GtIconFont.otf
