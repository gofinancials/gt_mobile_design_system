include: package:flutter_lints/flutter.yaml

# Accessibility rules are enforced at authoring time by the local
# `gt_a11y_lints` plugin under tools/. Run them with `dart run custom_lint`.
analyzer:
  # custom_lint only loads as a legacy plugin, and only from this list.
  plugins:
    - custom_lint
  errors:
    analysis_options_deprecated_plugins: ignore
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

custom_lint:
  rules:
    - avoid_raw_gesture_detector
    - require_image_semantics
    - require_semantic_role

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
