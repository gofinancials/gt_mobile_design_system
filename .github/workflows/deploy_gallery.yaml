name: Deploy Widgetbook to GitHub Pages

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"

# Allow one concurrent deployment, skipping runs queued behind an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'closed' &&
      github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && github.ref_type == 'tag')
    permissions:
      contents: read
      pages: write # Required to deploy to the Pages service
      id-token: write # Required for the Pages deployment OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          flutter-version: "3.47.0"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Widgetbook
        run: cd gallery && dart run build_runner build -d && flutter build web --wasm --target lib/main.dart --base-href "/${{ github.event.repository.name }}/"

      # The dartdoc bundled with Flutter 3.47.x (9.0.6) crashes in
      # `_stripDocImports` on the `@docImport` comments added in `platform`
      # 3.2.0; 9.0.8 fixes it (dart-lang/dartdoc#4268). Switch back to
      # `dart doc` once the bundled dartdoc is 9.0.8 or newer.
      - name: Build Docs
        run: |
          dart pub global activate dartdoc 9.0.8
          dart pub global run dartdoc --output=gallery/build/web/api

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
